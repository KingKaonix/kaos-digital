<section class="kaos-bg kaos-text py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="kaos-card p-4 border-0">
          <h2 class="fw-bold mb-3 text-center">Ready to Automate?</h2>
          <p class="kaos-text-secondary text-center mb-4">Book a free consultation. We'll audit your current setup and show you exactly what to automate first.</p>
          <form (ngSubmit)="onSubmit($event)" #f="ngForm" novalidate>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label kaos-text">Your Name</label>
                <input type="text" class="form-control kaos-form-control" placeholder="Your Name" name="name" ngModel required />
              </div>
              <div class="col-12">
                <label class="form-label kaos-text">Email Address</label>
                <input type="email" class="form-control kaos-form-control" placeholder="Email Address" name="email" ngModel required />
              </div>
              <div class="col-12">
                <label class="form-label kaos-text">Phone (optional)</label>
                <input type="tel" class="form-control kaos-form-control" placeholder="Phone (optional)" name="phone" ngModel />
              </div>
              <div class="col-12">
                <label class="form-label kaos-text">Message</label>
                <textarea class="form-control kaos-form-control" name="message" rows="4" placeholder="Tell us about your business..." ngModel></textarea>
              </div>
            </div>
            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary btn-lg px-5" [disabled]="f.invalid">Request Consultation</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
