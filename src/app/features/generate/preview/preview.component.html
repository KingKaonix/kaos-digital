<div class="kaos-card shadow-sm h-100">
  <div class="kaos-card-body d-flex justify-content-between align-items-center">
    <span class="fw-medium kaos-text">Preview</span>
    <div class="d-flex gap-2">
      <button
        class="btn btn-sm btn-outline-secondary"
        (click)="toggleResponsive()"
        [class.btn-primary]="mobile()"
        [class.btn-outline-secondary]="!mobile()"
      >
        {{ mobile() ? 'Mobile' : 'Desktop' }}
      </button>
      <button
        class="btn btn-sm btn-outline-primary refresh"
        title="Refresh preview"
        (click)="refresh()"
      >
        Refresh
      </button>
    </div>
  </div>

  <div class="p-0 position-relative">
    <div
      class="preview-wrap position-relative border rounded"
      [class.mobile-preview]="mobile()"
      style="height: 600px;"
    >
      <iframe
        #previewIframe
        class="preview-iframe"
        width="100%"
        height="100%"
        frameborder="0"
        sandbox="allow-scripts allow-same-origin"
        (error)="onIframeError()"
      ></iframe>

      @if (isLoading()) {
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-black bg-opacity-60 d-flex align-items-center justify-content-center">
          <div class="spinner-border kaos-spinner" role="status"></div>
        </div>
      }

      @if (loadError()) {
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-black bg-opacity-70 d-flex align-items-center justify-content-center rounded">
          <div class="text-center kaos-text-secondary">
            <p class="mb-2">{{ loadError() }}</p>
          </div>
        </div>
      }

      @if (!loadError() && !isLoading() && previewHtml() === '') {
        <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center kaos-empty">
          <span class="kaos-empty-icon">📄</span>
          <p>Preview appears here when code is generated.</p>
        </div>
      }
    </div>
  </div>
</div>
