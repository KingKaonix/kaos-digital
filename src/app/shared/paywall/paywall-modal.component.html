        </div>
        <h5 class="modal-title kaos-text" id="paywall-modal-title">Export is a paid feature</h5>
        <p class="kaos-text-secondary">
          {{ action() }} requires an active subscription or a one-time export purchase.
          {{ reason() ? reason() : '' }}
        </p>

        <div class="d-grid gap-2">
          <button class="btn btn-primary btn-lg" (click)="goToPricing()">
            Upgrade now
          </button>
          <button class="btn btn-outline-light" (click)="close()">Not now</button>
        </div>

        <p class="mt-3 kaos-text-secondary small">
          Subscribe monthly or buy a one-time export. Cancel anytime from the customer portal.
        </p>

  <div class="modal-backdrop kaos-bg fade show"></div>
</div>
