headersOrigin = "config"
redirectsOrigin = "config"
functionsDirectory = "/data/data/com.termux/files/home/kaosnet-site/netlify/functions"
functionsDirectoryOrigin = "config-v1"

[functions]

[functions."*"]

[[plugins]]
origin = "default"
package = "@netlify/angular-runtime"

[plugins.inputs]

[build]
publish = "/data/data/com.termux/files/home/kaosnet-site/dist"
publishOrigin = "inline"
commandOrigin = "config"
command = "npm ci --legacy-peer-deps && CI=false ng build"
functions = "/data/data/com.termux/files/home/kaosnet-site/netlify/functions"

[build.environment]
NODE_VERSION = "18"
NPM_FLAGS = "--legacy-peer-deps"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]